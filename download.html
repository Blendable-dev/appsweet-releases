<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download AppSweet</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1a1714; background: #f1eee8; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 64px 24px; }
      main { max-width: 560px; margin: 0 auto; }
      .brand { font-weight: 650; margin-bottom: 28px; }
      .mark { color: #b5740f; margin-right: 8px; }
      section { background: white; border: 1px solid #e5e0d7; border-radius: 14px; padding: 28px; }
      h1 { font-size: 28px; letter-spacing: -.025em; margin: 0 0 16px; }
      p { line-height: 1.6; color: #635c51; }
      a { color: #8f5a08; text-underline-offset: 3px; }
      .button { display: inline-block; background: #f0be5e; color: #1a1714; border: 1px solid #b5740f; padding: 12px 18px; border-radius: 8px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
      :focus-visible { outline: 3px solid #8f5a08; outline-offset: 4px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">◆</span>AppSweet</div>
      <section>
        <h1>Your Dokploy launcher</h1>
        <p id="status" role="status" aria-live="polite">Finding your download…</p>
        <a id="download" class="button" hidden>Download launcher</a>
        <button id="retry" class="button" type="button" hidden>Try again</button>
        <noscript><p>Enable JavaScript to download the latest launcher automatically, or choose a version from the releases below.</p></noscript>
      </section>
      <p>Looking for another version? <a href="https://github.com/Blendable-dev/appsweet-releases/releases">Browse all releases</a>.</p>
    </main>
    <script type="module" src="./download.mjs"></script>
  </body>
</html>
